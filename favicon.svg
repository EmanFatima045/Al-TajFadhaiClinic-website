<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1513"/>
      <stop offset="100%" stop-color="#3A080C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE7CB"/>
      <stop offset="50%" stop-color="#BFAA91"/>
      <stop offset="100%" stop-color="#8C7860"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D61827"/>
      <stop offset="100%" stop-color="#9B0D17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.45"/>

  <!-- Al Taj Alfadhi Luxury Emblem -->
  <g transform="translate(40, 36) scale(4.32)" filter="url(#glow)">
    <!-- Gold Crown / Upper Architecture -->
    <path d="M24 16V44" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M38 16V44" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M52 16V30H78" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 44H78" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M12 44H38" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Royal Burgundy Medical Cross / Crown Base -->
    <path d="M12 56H38" stroke="url(#rubyGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M24 56V70H12" stroke="url(#rubyGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 56V84" stroke="url(#rubyGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M52 56V84" stroke="url(#rubyGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M66 56V70H88" stroke="url(#rubyGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 84H88" stroke="url(#rubyGrad)" stroke-width="6.5" stroke-linecap="round"/>
  </g>
</svg>

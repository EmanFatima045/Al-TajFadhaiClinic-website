<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Lighting and Room Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F2"/>
      <stop offset="60%" stop-color="#F4ECE1"/>
      <stop offset="100%" stop-color="#EADBCE"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDF0FB"/>
      <stop offset="70%" stop-color="#EDF7FC"/>
      <stop offset="100%" stop-color="#FAF4EE"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F452A"/>
      <stop offset="50%" stop-color="#8C5838"/>
      <stop offset="100%" stop-color="#5A361F"/>
    </linearGradient>
    <linearGradient id="leatherMat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5734A"/>
      <stop offset="100%" stop-color="#7B502C"/>
    </linearGradient>
    <linearGradient id="burgundyChair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B81422"/>
      <stop offset="100%" stop-color="#6B0810"/>
    </linearGradient>
    <linearGradient id="creamLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE7CB"/>
      <stop offset="50%" stop-color="#BFAA91"/>
      <stop offset="100%" stop-color="#8C7860"/>
    </linearGradient>
    <linearGradient id="skinDoctor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0CF"/>
      <stop offset="100%" stop-color="#E9BA9D"/>
    </linearGradient>
    <linearGradient id="skinPatient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AF8D"/>
      <stop offset="100%" stop-color="#C58D68"/>
    </linearGradient>
    <linearGradient id="doctorHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E1B"/>
      <stop offset="100%" stop-color="#24140A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A1513" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Consultation Suite Background -->
  <rect width="800" height="1000" fill="url(#wallGrad)"/>

  <!-- High Panoramic Window with City Skyline Silhouette -->
  <g opacity="0.85">
    <rect x="120" y="40" width="300" height="420" rx="8" fill="url(#windowGrad)"/>
    <!-- Subtle Skyline Silhouette -->
    <path d="M140 420V320H165V420M175 420V260H205V420M215 420V340H240V420M250 420V220H270L280 200L290 220V420M300 420V290H325V420M335 420V330H365V420M375 420V350H400V420" stroke="#C5D9E8" stroke-width="2" fill="#D3E5F2" opacity="0.6"/>
    <!-- Translucent Curtains -->
    <rect x="110" y="40" width="50" height="440" fill="#FFFFFF" opacity="0.5"/>
    <rect x="380" y="40" width="50" height="440" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Luxury Shelving / Credentials on Right Wall -->
  <rect x="710" y="40" width="90" height="520" rx="4" fill="#E6D7C7" stroke="#D3BEA8" stroke-width="2"/>
  <rect x="720" y="100" width="70" height="14" rx="2" fill="#BFAA91" opacity="0.8"/>
  <rect x="725" y="125" width="20" height="60" rx="2" fill="#9B0D17"/>
  <rect x="750" y="120" width="18" height="65" rx="2" fill="#5C554D"/>
  <rect x="772" y="130" width="18" height="55" rx="2" fill="#8C7860"/>
  <rect x="720" y="220" width="70" height="14" rx="2" fill="#BFAA91" opacity="0.8"/>
  <rect x="725" y="245" width="60" height="80" rx="3" fill="#FAF7F2" stroke="#BFAA91" stroke-width="2"/>
  <circle cx="755" cy="275" r="14" fill="#FFE7CB" stroke="#9B0D17" stroke-width="2"/>

  <!-- Left Wall Art Frame: Arabic Calligraphy / Medical Trust -->
  <g filter="url(#softShadow)">
    <rect x="25" y="160" width="75" height="160" rx="3" fill="#FAF7F2" stroke="#BFAA91" stroke-width="6"/>
    <path d="M45 200 Q60 210 50 240 Q70 230 55 280" stroke="#8C7860" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Luxury Velvet Accent Lounge Chair in Background -->
  <g transform="translate(400, 390)">
    <path d="M15 80 C15 30 115 30 115 80 L110 170 L20 170 Z" fill="url(#burgundyChair)"/>
    <rect x="35" y="110" width="60" height="40" rx="8" fill="#FFE7CB" opacity="0.85"/>
  </g>

  <!-- Doctor Executive High-Back Chair (Cream Leather) -->
  <g transform="translate(80, 360)">
    <path d="M30 40 C30 -20 170 -20 170 40 L160 280 L40 280 Z" fill="url(#creamLeather)" stroke="#D8C4AD" stroke-width="3"/>
  </g>

  <!-- Licensed Doctor (Dr. Bushra Sobia) - Center Left -->
  <g transform="translate(130, 340)">
    <!-- Hair -->
    <path d="M60 40 C50 -10 130 -10 120 40 C140 100 130 170 125 200 C110 180 110 120 110 90 C80 90 75 140 60 190 C55 150 50 80 60 40 Z" fill="url(#doctorHair)"/>
    <!-- Head & Warm Smile -->
    <circle cx="90" cy="55" r="32" fill="url(#skinDoctor)"/>
    <!-- Eyes, Eyebrows & Smile -->
    <path d="M78 48 Q84 44 90 48" stroke="#3A2012" stroke-width="2.5" fill="none"/>
    <path d="M96 48 Q102 44 108 48" stroke="#3A2012" stroke-width="2.5" fill="none"/>
    <ellipse cx="84" cy="54" rx="3" ry="4" fill="#24140A"/>
    <ellipse cx="102" cy="54" rx="3" ry="4" fill="#24140A"/>
    <path d="M84 70 Q93 80 102 70" stroke="#9B0D17" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- White Doctor Coat & Inner Professional Attire -->
    <path d="M55 105 L80 135 L106 135 L130 105 L150 280 L35 280 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <path d="M80 100 L93 140 L106 100 Z" fill="#9B0D17"/>
    <!-- Stethoscope around Neck -->
    <path d="M72 105 C65 150 70 190 85 210 C92 210 95 190 98 160 C105 130 115 105 115 105" stroke="#1E3A5F" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="85" cy="214" r="7" fill="#C5D3E0" stroke="#1E3A5F" stroke-width="2"/>
    
    <!-- Arms & Hands Gesturing Warmly -->
    <path d="M45 140 L20 220 L75 230 L85 170 Z" fill="#FFFFFF"/>
    <circle cx="20" cy="225" r="14" fill="url(#skinDoctor)"/>
    <path d="M135 140 L180 215 L140 230 L115 170 Z" fill="#FFFFFF"/>
    <circle cx="178" cy="220" r="14" fill="url(#skinDoctor)"/>
  </g>

  <!-- Executive Wooden Consultation Desk -->
  <g transform="translate(0, 560)">
    <!-- Desk Main Table Top -->
    <path d="M0 40 L800 40 L800 95 L0 95 Z" fill="url(#deskWood)" filter="url(#softShadow)"/>
    <rect x="0" y="40" width="800" height="8" fill="#A8754D"/>
    <!-- Desk Pedestal Base -->
    <rect x="30" y="95" width="220" height="345" fill="#4E2F1A"/>
    <rect x="550" y="95" width="220" height="345" fill="#4E2F1A"/>

    <!-- Luxury Leather Desk Blotter / Pad -->
    <rect x="180" y="44" width="340" height="42" rx="4" fill="url(#leatherMat)" stroke="#BFAA91" stroke-width="1.5"/>

    <!-- Medical Consultation Chart & Clipboard on Desk -->
    <rect x="50" y="32" width="110" height="52" rx="4" fill="#FAF7F2" stroke="#BFAA91" stroke-width="2" transform="rotate(-3, 105, 58)"/>
    <rect x="65" y="40" width="80" height="6" rx="2" fill="#9B0D17" opacity="0.8"/>
    <rect x="65" y="52" width="60" height="4" rx="2" fill="#8C7860" opacity="0.6"/>
    <rect x="65" y="60" width="70" height="4" rx="2" fill="#8C7860" opacity="0.6"/>

    <!-- Medical Pen & Stethoscope Chestpiece on Blotter -->
    <rect x="300" y="50" width="60" height="4" rx="2" fill="#1A1513" stroke="#BFAA91" stroke-width="1"/>
    <circle cx="240" cy="55" r="9" fill="#C5D3E0" stroke="#5C554D" stroke-width="2.5"/>

    <!-- Sleek Slim Consultation Tablet / Laptop -->
    <path d="M420 54 L520 54 L540 22 L440 22 Z" fill="#E6ECF2" stroke="#9EAEC0" stroke-width="2"/>
    <path d="M440 22 L540 22 L540 -40 L440 -40 Z" fill="#1A202C" stroke="#718096" stroke-width="2"/>
    <rect x="446" y="-34" width="88" height="50" fill="#2B6CB0" opacity="0.3"/>
    <path d="M455 -20 H520 M455 -10 H500 M455 0 H515" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Patient in Traditional UAE Attire (White Kandura) - Seated Right -->
  <g transform="translate(460, 440)">
    <!-- Patient Ergonomic Armchair (Beige Leather) -->
    <path d="M40 80 C40 10 180 10 180 80 L170 340 L50 340 Z" fill="url(#creamLeather)" stroke="#D8C4AD" stroke-width="3"/>

    <!-- Head & Beard Profile -->
    <path d="M80 60 C80 10 145 10 145 60 C145 80 145 110 120 120 C95 120 80 100 80 60 Z" fill="url(#skinPatient)"/>
    <path d="M110 50 Q118 45 125 50" stroke="#1A1513" stroke-width="2.5" fill="none"/>
    <circle cx="120" cy="56" r="3.5" fill="#1A1513"/>
    <!-- Groomed Beard -->
    <path d="M90 70 C90 125 140 125 140 75 Q125 80 110 80 Z" fill="#24140A"/>
    <!-- White Kandura Robe -->
    <path d="M60 120 C50 160 30 280 20 440 L210 440 C200 320 180 180 165 120 Z" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Attentive Posture -->
    <path d="M50 200 L10 260 L60 275 L85 220 Z" fill="#F7FAFC"/>
    <circle cx="10" cy="265" r="14" fill="url(#skinPatient)"/>
  </g>

  <!-- Subtle Ambient Glow Overlay -->
  <rect width="800" height="1000" fill="none" stroke="url(#goldAccent)" stroke-width="8" rx="16" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1916"/>
      <stop offset="50%" stop-color="#2D2420"/>
      <stop offset="100%" stop-color="#151210"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1A9"/>
      <stop offset="50%" stop-color="#DFB76C"/>
      <stop offset="100%" stop-color="#9E7632"/>
    </linearGradient>
    <linearGradient id="robotBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDEDED"/>
      <stop offset="100%" stop-color="#D5D5D8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BF2EC"/>
      <stop offset="100%" stop-color="#00A89D"/>
    </linearGradient>
    <linearGradient id="shemaghRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3121D"/>
      <stop offset="50%" stop-color="#930B14"/>
      <stop offset="100%" stop-color="#68050C"/>
    </linearGradient>
    <linearGradient id="thobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3EFEA"/>
      <stop offset="100%" stop-color="#DCD4CA"/>
    </linearGradient>
    <linearGradient id="bishtGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7632"/>
      <stop offset="50%" stop-color="#FCE1A9"/>
      <stop offset="100%" stop-color="#9E7632"/>
    </linearGradient>

    <!-- Shemagh Pattern -->
    <pattern id="shemaghPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#FFFFFF"/>
      <path d="M0 0 L6 6 L0 12 Z M12 0 L6 6 L12 12 Z" fill="#9E101B" opacity="0.9"/>
      <rect x="5" y="5" width="2" height="2" fill="#FFFFFF"/>
      <circle cx="6" cy="6" r="0.8" fill="#FCE1A9"/>
    </pattern>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Luxury Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="12 4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.3"/>

  <!-- ================= SHEMAGH BACK (Drapes over shoulders) ================= -->
  <path d="M38 90 C32 125 40 168 62 186 C72 195 128 195 138 186 C160 168 168 125 162 90 Z" fill="url(#shemaghPattern)" filter="url(#dropShadow)"/>

  <!-- ================= SAUDI THOBE & ROYAL BISHT COLLAR ================= -->
  <!-- Thobe Body -->
  <path d="M52 145 C52 135 75 130 100 130 C125 130 148 135 148 145 L156 200 L44 200 Z" fill="url(#thobeGrad)"/>
  
  <!-- Royal Bisht Trim (Gold Embroidered Edge) -->
  <path d="M56 150 C70 140 85 138 100 138 C115 138 130 140 144 150 L146 200 L136 200 L134 158 C122 150 112 148 100 148 C88 148 78 150 66 158 L64 200 L54 200 Z" fill="url(#bishtGold)"/>
  
  <!-- Thobe Collar & Gold Buttons -->
  <path d="M88 132 L112 132 L110 162 L90 162 Z" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1"/>
  <circle cx="100" cy="140" r="2" fill="url(#goldGrad)"/>
  <circle cx="100" cy="150" r="2" fill="url(#goldGrad)"/>
  <circle cx="100" cy="160" r="2" fill="url(#goldGrad)"/>

  <!-- ================= GOLDEN MEDICAL STETHOSCOPE ================= -->
  <!-- Tubes around neck -->
  <path d="M72 138 C68 158 75 178 92 184" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M128 138 C132 158 125 178 108 184" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Chestpiece -->
  <circle cx="100" cy="184" r="8" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
  <circle cx="100" cy="184" r="5" fill="#1E1916" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- ================= CUTE ROBOT HEAD ================= -->
  <!-- Neck connector -->
  <rect x="90" y="118" width="20" height="15" rx="4" fill="#A8A8B0" stroke="#7A7A82" stroke-width="1"/>
  
  <!-- Head Capsule Base -->
  <rect x="52" y="52" width="96" height="76" rx="34" fill="url(#robotBodyGrad)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- Cute Visor Screen -->
  <rect x="62" y="64" width="76" height="50" rx="20" fill="url(#visorGrad)" stroke="#2C3240" stroke-width="1.5"/>

  <!-- Glowing Robot AI Eyes (Friendly curved smile eyes) -->
  <g filter="url(#softGlow)">
    <!-- Left Eye -->
    <ellipse cx="82" cy="85" rx="8" ry="9" fill="url(#eyeGlow)"/>
    <circle cx="85" cy="82" r="3" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="118" cy="85" rx="8" ry="9" fill="url(#eyeGlow)"/>
    <circle cx="121" cy="82" r="3" fill="#FFFFFF"/>
    <!-- Warm Smiling Blush -->
    <ellipse cx="74" cy="98" rx="5" ry="2.5" fill="#FF5E7E" opacity="0.65"/>
    <ellipse cx="126" cy="98" rx="5" ry="2.5" fill="#FF5E7E" opacity="0.65"/>
  </g>

  <!-- Cute AI Audio Mouth Line -->
  <path d="M93 98 Q100 104 107 98" fill="none" stroke="url(#eyeGlow)" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Cute Golden Crown Antenna -->
  <path d="M100 52 L100 38" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="35" r="5" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  <circle cx="100" cy="35" r="2.5" fill="#5BF2EC"/>

  <!-- ================= SHEMAGH / GHUTRA (DRAPED ON HEAD) ================= -->
  <!-- Left & Right Fold Falls -->
  <path d="M46 58 C38 78 34 110 40 148 C46 156 56 158 58 148 C54 118 56 86 64 68 Z" fill="url(#shemaghPattern)" filter="url(#dropShadow)"/>
  <path d="M154 58 C162 78 166 110 160 148 C154 156 144 158 142 148 C146 118 144 86 136 68 Z" fill="url(#shemaghPattern)" filter="url(#dropShadow)"/>

  <!-- Top Crown Drapes of Shemagh -->
  <path d="M48 56 C56 34 80 26 100 26 C120 26 144 34 152 56 C140 48 122 44 100 44 C78 44 60 48 48 56 Z" fill="url(#shemaghPattern)"/>

  <!-- ================= SAUDI ROYAL AGAL (عقال ملكي أسود ومذهب) ================= -->
  <!-- Top Agal Loop -->
  <ellipse cx="100" cy="46" rx="46" ry="8" fill="none" stroke="#12100E" stroke-width="6" filter="url(#dropShadow)"/>
  <ellipse cx="100" cy="46" rx="46" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="6 3"/>
  
  <!-- Bottom Agal Loop -->
  <ellipse cx="100" cy="52" rx="48" ry="8.5" fill="none" stroke="#12100E" stroke-width="6" filter="url(#dropShadow)"/>
  <ellipse cx="100" cy="52" rx="48" ry="8.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Royal Golden Clinic Brooch Emblem on Agal/Head -->
  <g transform="translate(100, 48)">
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <path d="M-3 -1 L0 -4 L3 -1 L2 3 L-2 3 Z" fill="#9E101B"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
